# Local development stack: Postgres + Django backend with autoreload.
# Production uses `docker-compose.prod.yml` (added in a later step) with
# gunicorn + a reverse proxy instead of `runserver`.
#
# Usage:
#   cp backend/.env.example backend/.env   # once, then fill in real values
#   docker compose up

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lucasdev}
      POSTGRES_USER: ${POSTGRES_USER:-lucasdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lucasdev}
    volumes:
      - lucasdev_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lucasdev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  lucasdev_db_data:
